# Builds the Dive installer ISO on GitHub's servers and attaches it to a release.
# Trigger: push a tag like v0.1, or run it by hand from the Actions tab.
name: Build Dive ISO
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  iso:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space on the runner
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true; df -h / | tail -1
      - name: Build inside a privileged Fedora container
        run: |
          docker run --name divebuild --privileged --cap-add=ALL --security-opt seccomp=unconfined --security-opt apparmor=unconfined --cgroupns=host -v /dev:/dev -v "${{ github.workspace }}:/src:ro" fedora:43 bash -c '
            set -euo pipefail
            cp -r /src /dive-src && echo "sources copied"
            dnf install -y --skip-unavailable lorax-lmc-novirt lorax pykickstart xorriso git
            git clone -q -b f43 https://pagure.io/fedora-kickstarts.git /usr/share/spin-kickstarts \
              || git clone -q https://pagure.io/fedora-kickstarts.git /usr/share/spin-kickstarts
            ls /usr/share/spin-kickstarts/fedora-live-workstation.ks
            echo "=== probe: can this container install packages into a chroot? ==="
            mkdir -p /out
            mkdir -p /tmp/probe /tmp/rpms && dnf -y download --destdir=/tmp/rpms setup filesystem > /out/probe-dl.log 2>&1 || true
            rpm -vv --root=/tmp/probe -i --nodeps /tmp/rpms/setup-*.rpm > /out/probe-rpm.log 2>&1 && echo "probe rpm OK" || { echo "probe rpm FAILED"; grep -iE "error|fail|warning" /out/probe-rpm.log | head -20; tail -15 /out/probe-rpm.log; }
            dnf -y --installroot=/tmp/probe2 --releasever=43 --setopt=install_weak_deps=False install filesystem setup bash > /out/probe-dnf.log 2>&1 && echo "probe dnf OK: $(rpm --root=/tmp/probe2 -qa | wc -l) packages" || { echo "probe dnf FAILED"; tail -30 /out/probe-dnf.log; }
            df -h /var/tmp | tail -1; mount | grep -E " / | /var/tmp " | head -3; cat /proc/sys/fs/protected_regular /proc/sys/kernel/unprivileged_userns_clone 2>/dev/null || true
            ksflatten -c /dive-src/distro/dive-live.ks -o /tmp/dive-flat.ks
            VER=$(sed -n "s/^DIVE_VERSION=\"\(.*\)\"/\1/p" /dive-src/distro/dive-setup.sh)
            livemedia-creator --make-iso --no-virt --ks /tmp/dive-flat.ks --resultdir /tmp/lmc \
              --project Dive --releasever 43 --volid DIVE_LIVE --iso-name "Dive-${VER}-x86_64-full.iso" \
              --iso-only --logfile /out/lmc.log --tmp /var/tmp || { echo "=== livemedia-creator failed, last log lines ==="; tail -80 /out/lmc.log; tail -40 /var/tmp/lmc-logs/anaconda/anaconda.log 2>/dev/null || true; exit 1; }
            mv /tmp/lmc/*.iso /out/
            ls -lh /out
          '
      - name: Collect the image
        if: always()
        run: docker cp divebuild:/out ./out && ls -lh out
      - name: Check the image fits on FAT32 (needed for install-from-Windows)
        run: |
          ISO=$(ls out/*.iso); SIZE=$(stat -c %s "$ISO"); echo "ISO size: $SIZE bytes"
          [ "$SIZE" -lt 4294967295 ] || { echo "ISO is over 4 GB, the Windows installer cannot copy it to FAT32. Remove packages in distro/dive-live.ks."; exit 1; }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: dive-iso, path: out/ }
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with: { files: out/*.iso }
