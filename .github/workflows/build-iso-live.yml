# Builds Dive-<ver>-x86_64.iso by injecting the Dive kickstart and sources into
# Fedora's official Workstation live ISO (mkksiso). No root filesystem build needed.
name: Build Dive ISO (from Fedora live)
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  iso:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space on the runner
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true; df -h / | tail -1
      - name: Download Fedora Workstation live ISO
        run: |
          BASE="https://download.fedoraproject.org/pub/fedora/linux/releases/43/Workstation/x86_64/iso/"
          NAME=$(curl -sL "$BASE" | grep -oE 'Fedora-Workstation-Live-[^"]*x86_64[^"]*\.iso' | grep -v CHECKSUM | sort -u | tail -1)
          [ -n "$NAME" ] || { echo "Could not find the Fedora 43 Workstation ISO at $BASE"; exit 1; }
          echo "Using $NAME"; curl -L --retry 3 -o fedora.iso "$BASE$NAME"; ls -lh fedora.iso
      - name: Inject Dive with mkksiso
        run: |
          docker run --rm --privileged -v "${{ github.workspace }}:/w" fedora:43 bash -c '
            set -euo pipefail
            dnf install -y --skip-unavailable lorax xorriso isomd5sum
            VER=$(sed -n "s/^DIVE_VERSION=\"\(.*\)\"/\1/p" /w/distro/dive-setup.sh)
            mkdir -p /tmp/dive-src && cp -r /w/. /tmp/dive-src/ && rm -rf /tmp/dive-src/.git /tmp/dive-src/fedora.iso /tmp/dive-src/out
            mkdir -p /w/out
            cp /w/distro/dive-install.ks /tmp/dive-install.ks
            # Keep Fedora'"'"'s EFI boot image and volume label (the Windows installer writes its own boot entry).
            if ! mkksiso --skip-mkefiboot --ks /tmp/dive-install.ks --add /tmp/dive-src /w/fedora.iso "/w/out/Dive-${VER}-x86_64.iso"; then
              echo "mkksiso failed, falling back to xorriso (adds the files without touching boot menus)"
              rm -f "/w/out/Dive-${VER}-x86_64.iso"
              xorriso -indev /w/fedora.iso -outdev "/w/out/Dive-${VER}-x86_64.iso" -boot_image any replay -map /tmp/dive-src /dive-src -map /tmp/dive-install.ks /dive-install.ks -commit
            fi
            echo "=== ISO contents ==="; xorriso -indev "/w/out/Dive-${VER}-x86_64.iso" -ls / -ls /images/pxeboot -ls /EFI/BOOT -ls /LiveOS -ls /dive-src 2>/dev/null || true
            xorriso -indev "/w/out/Dive-${VER}-x86_64.iso" -osirrox on -extract /dive-install.ks /tmp/check.ks 2>/dev/null && echo "kickstart present in ISO" || echo "WARNING: /dive-install.ks not found in ISO"
            ls -lh /w/out
          '
      - name: Check the image fits on FAT32 (needed for install-from-Windows)
        run: |
          ISO=$(ls out/*.iso); SIZE=$(stat -c %s "$ISO"); echo "ISO size: $SIZE bytes"
          [ "$SIZE" -lt 4294967295 ] || { echo "ISO is over 4 GB"; exit 1; }
      - name: Split for the release (GitHub allows 2 GB per file)
        run: |
          cd out && ISO=$(ls *.iso) && sha256sum "$ISO" > SHA256SUMS
          split -b 1500M -d -a 2 "$ISO" "$ISO.part" && ls -lh && rm "$ISO"
          echo "Parts:"; ls *.part*
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/*.part*
            out/SHA256SUMS
          body: |
            Dive installer image, built from Fedora 43 Workstation live with Dive injected.
            The image is split into parts (GitHub's 2 GB limit). `install.ps1` downloads and joins them automatically.
            To join by hand on Windows: `cmd /c copy /b Dive-0.1-x86_64.iso.part00+Dive-0.1-x86_64.iso.part01 Dive-0.1-x86_64.iso`
            On Linux/macOS: `cat Dive-0.1-x86_64.iso.part* > Dive-0.1-x86_64.iso`
